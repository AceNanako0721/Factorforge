name: factorforge
x-runtime: &runtime
  image: factorforge-core:${FF_IMAGE_TAG:?run deploy prepare}
  init: true
  user: ${FF_UID:?}:${FF_GID:?}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.5
  stop_grace_period: 45s
  tmpfs: ["/tmp:rw,nosuid,nodev,size=64m", "/var/lib/postgresql/data:rw,nosuid,nodev,size=1m"]
  networks: [private]
  environment:
    SSL_CERT_FILE: /trust/ca.pem
  logging: &logging
    driver: local
    options: {max-size: 10m, max-file: "3"}
  healthcheck:
    test: [CMD, ff-runtime, check]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 30s
  profiles: [app]
services:
  postgres:
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic]
    image: factorforge-postgres:${FF_IMAGE_TAG:?}
    init: true
    user: ${FF_UID:?}:${FF_GID:?}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 60s
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m", "/var/run/postgresql:rw,nosuid,nodev,size=16m"]
    networks: [private]
    environment:
      POSTGRES_USER: ff_admin
      POSTGRES_DB: factorforge
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - {type: bind, source: '${FF_DATA_ROOT:?}/postgres', target: /var/lib/postgresql/data, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_PROFILE_ROOT:?}/postgres', target: /secrets, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/postgres', target: /logs, bind: {create_host_path: false}}
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'ff-runtime check && pg_isready -U ff_admin -d factorforge']
      interval: 10s
      timeout: 5s
      retries: 6
  gateway:
    <<: *runtime
    command: [ff-runtime, gateway]
    volumes:
      - {type: bind, source: '${FF_DATA_ROOT}/tls/gateway', target: /tls, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/gateway', target: /logs, bind: {create_host_path: false}}
    healthcheck:
      test: [CMD, ff-runtime, check, --tcp, '127.0.0.1:8443']
      interval: 15s
      timeout: 5s
      retries: 3
  trading-api:
    <<: *runtime
    command: ["trading-api","--config","/profile/config.toml","--host","0.0.0.0","--port","8000","--restrict-filesystem"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/trading-api', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/trading-api', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
  replay-executor:
    <<: *runtime
    command: ["replay-executor","--config","/profile/config.toml","--run-id","${FF_RUN_ID:?}","--executor-id","factorforge-internal"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/replay-executor', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/replay-executor', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
  market-collector:
    <<: *runtime
    command: ["market-collector","--config","/profile/config.toml","--run-id","${FF_RUN_ID:?}","--instrument","${FF_INSTRUMENT:?}","--interval","${FF_CANDLE_INTERVAL:?}","--lookback-seconds","${FF_LOOKBACK_SECONDS:?}","--poll-seconds","${FF_POLL_SECONDS:?}","--multiplier","${FF_MULTIPLIER:?}","--publication-delay-ms","${FF_PUBLICATION_DELAY_MS:?}","--trade-limit","${FF_TRADE_LIMIT:?}","--sim-capabilities","--sim-frames"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private, egress]
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/market-collector', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/market-collector', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
  strategy-api:
    <<: *runtime
    command: ["strategy-api","--config","/profile/config.toml"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/strategy-api', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/strategy-api', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
  strategy-internal:
    <<: *runtime
    command: ["strategy-api","--internal","--config","/profile/config.toml"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/strategy-internal', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/strategy-internal', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
  strategy-scheduler:
    <<: *runtime
    command: ["strategy-scheduler","--config","/profile/config.toml"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/strategy-scheduler', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/strategy-scheduler', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
  strategy-feedback:
    <<: *runtime
    command: ["strategy-feedback","--config","/profile/config.toml"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/strategy-feedback', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/strategy-feedback', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
  judgment-worker:
    <<: *runtime
    command: ["judgment-worker","--config","/profile/config.toml"]
    depends_on:
      postgres: {condition: service_healthy}
    image: factorforge-core:${FF_IMAGE_TAG:?}
    mem_limit: 256m
    pids_limit: 128
    networks: [private, egress]
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/judgment-worker', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/judgment-worker', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_PROFILE_ROOT}/judgment-worker/model.toml', target: /private/model.toml, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/model-runtime', target: /private/runtime, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_PROMPTS_DIR:?}', target: /private/prompts, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/assets', target: /assets, read_only: true, bind: {create_host_path: false}}
  position-manager:
    <<: *runtime
    command: ["position-manager","--config","/profile/config.toml"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private, egress]
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/position-manager', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/position-manager', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_PROMPTS_DIR:?}', target: /private/prompts, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/assets', target: /assets, read_only: true, bind: {create_host_path: false}}
  soxl-jev-api:
    <<: *runtime
    command: ["soxl-jev-api","--config","/profile/config.toml"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/soxl-jev-api', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/soxl-jev-api', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
  console-api:
    <<: *runtime
    command: ["console-api","--profile","/profile/profile.json"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private, egress]
    ports: ["127.0.0.1:${FF_CONSOLE_PORT:?}:8443"]
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/console-api', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/console-api', target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/trust', target: /trust, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/tls/console', target: /tls, read_only: true, bind: {create_host_path: false}}
  operator:
    <<: *runtime
    profiles: [ops]
    restart: "no"
    command: [deploy-schema, --config, /profile/schema.json]
    volumes:
      - {type: bind, source: '${FF_PROFILE_ROOT}/operator', target: /profile, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${FF_DATA_ROOT}/logs/operator', target: /logs, bind: {create_host_path: false}}
networks:
  private: {internal: true}
  egress: {}
