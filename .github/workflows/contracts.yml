name: Repository

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check actual public Git content and reachable history
        run: python tools/check_public_tree.py --all-history
      - name: Check baseline and PR version classification
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            python tools/check_repository.py --base "$PR_BASE_SHA"
          else
            python tools/check_repository.py
          fi
      - name: Exercise private-file, history and version guards
        run: python -m unittest discover -s tests -v
      - name: Check historical design and current layer traceability
        run: |
          python doc/.requirements-build/audit_detail_v11.py
          python doc/.v20-build/audit_v20.py

  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked contract validators
        run: python -m pip install -r contracts/requirements.txt
      - name: Lint OpenAPI, validate fixtures and frozen surface, generate stubs
        run: python contracts/check_contract.py

  trading-checks:
    name: trading-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked trading and test dependencies
        run: |
          python -m pip install -r tools/requirements-trading.lock
          python -m pip install -e . --no-deps
      - name: Enforce directory tree and layer dependencies
        run: python tools/check_layout.py
      - name: Exercise SIM, HTTP, real PostgreSQL, faults and separate processes
        run: python -m pytest tests/trading -q
      - name: Check generated current API contract
        run: |
          python tools/export_trading_contract.py
          git diff --exit-code -- contracts/v2/trading/openapi.json
      - name: Build the independent trading distribution
        run: python tools/build_trading.py

  strategy-checks:
    name: strategy-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies and independent P1/P2 wheels
        run: |
          python -m pip install -r tools/requirements-trading.lock
          python tools/build_trading.py
          python tools/build_strategy.py
          python -m pip install --no-deps runtime/build/*.whl
      - name: Verify framework, P1 SIM, PostgreSQL faults, roles and installed processes
        run: python -m pytest tests/strategy -q
      - name: Verify public and workload contracts
        run: |
          python tools/export_strategy_contract.py
          python tools/export_trading_contract.py
          git diff --exit-code -- contracts/v2
