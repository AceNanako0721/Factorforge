name: Repository

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check actual public Git content and reachable history
        run: go run ./tools/check-public-tree --all-history
      - name: Check baseline and PR version classification
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            go run ./tools/check-repository --base "$PR_BASE_SHA"
          else
            go run ./tools/check-repository
          fi
      - name: Exercise index, history, version, HTML and contract rejection guards
        run: go test ./tests/engineering -count=1
      - name: Verify layer placement, historical documents and static analysis
        run: |
          go run ./tools/check-layout
          go run ./tools/check-html-documents
          go run ./tools/check-document-history
          go vet ./...

  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate offline OpenAPI, fixtures, frozen surface and typed stubs
        run: go run ./tools/check-contracts
      - name: Check generated public and workload API contracts
        run: |
          go run ./tools/export-trading-contract
          go run ./tools/export-strategy-contract
          if [ -d tools/export-instance-contract ]; then
            go run ./tools/export-instance-contract
          fi
          if [ -d tools/export-console-contract ]; then
            go run ./tools/export-console-contract
            go run ./tools/generate-console-projections --check
          fi
          git diff --exit-code -- contracts/v2

  trading-checks:
    name: trading-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install native PostgreSQL test binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
      - name: Exercise SIM, HTTP, PostgreSQL, faults and independent native processes
        run: go test ./tests/trading ./tests/trading/processprobe -count=1
      - name: Build independent trading executables
        run: go run ./tools/build-trading

  strategy-checks:
    name: strategy-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install native PostgreSQL test binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
      - name: Verify frozen replay, P1 SIM, roles, restart and read-only trace
        run: go test ./tests/strategy -count=1
      - name: Build independent framework executables
        run: go run ./tools/build-strategy
      - name: Exercise and build implemented application modules
        run: |
          if [ -d tests/applications ]; then
            go test ./tests/applications/... -count=1
            go run ./tools/build-instance
          fi

  console-checks:
    name: console-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.23.1'
      - name: Install pinned frontend dependencies without lifecycle scripts
        working-directory: src/factorforge/applications/console/web
        run: npm exec --yes --package=pnpm@10.33.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck, build and test browser read semantics
        working-directory: src/factorforge/applications/console/web
        run: |
          npm exec --yes --package=pnpm@10.33.0 -- pnpm build
          npm exec --yes --package=pnpm@10.33.0 -- pnpm test
          npm exec --yes --package=pnpm@10.33.0 -- pnpm exec playwright install --with-deps chromium
          npm exec --yes --package=pnpm@10.33.0 -- pnpm test:browser
      - name: Build native BFF and validate public static artifacts
        run: go run ./tools/build-console --web-build runtime/web-build
